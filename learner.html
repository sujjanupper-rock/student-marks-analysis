<script src="https://cdn.tailwindcss.com"></script>

tailwind.config={darkMode:'class',theme:{extend:{colors:{primary:'#00d4aa','primary-dark':'#00a888',accent:'#fbbf24',surface:{900:'#0b0f19',800:'#111827',700:'#1a2235',600:'#243049'}},fontFamily:{display:['Space Grotesk','sans-serif'],mono:['JetBrains Mono','monospace']}}}}

<style>
*{margin:0;padding:0;box-sizing:border-box;scrollbar-width:thin;scrollbar-color:#243049 #111827}
::-webkit-scrollbar{width:6px}::-webkit-scrollbar-track{background:#111827}::-webkit-scrollbar-thumb{background:#243049;border-radius:3px}
body{font-family:'Space Grotesk',sans-serif;background:#0b0f19;color:#e2e8f0;overflow-x:hidden}
.code-font{font-family:'JetBrains Mono',monospace}
.sidebar{width:250px;height:100vh;position:fixed;left:0;top:0;background:#111827;border-right:1px solid #1e293b;z-index:40;transition:transform .3s;overflow-y:auto}
.main-content{margin-left:250px;min-height:100vh;transition:margin .3s}
.nav-item{display:flex;align-items:center;gap:12px;padding:9px 18px;cursor:pointer;transition:all .2s;border-radius:8px;margin:2px 10px;color:#94a3b8;font-size:13px}
.nav-item:hover{background:#1a2235;color:#e2e8f0}
.nav-item.active{background:rgba(0,212,170,.12);color:#00d4aa;border-left:3px solid #00d4aa}
.nav-item i{width:18px;text-align:center}
.glow-card{background:#111827;border:1px solid #1e293b;border-radius:14px;transition:all .3s;overflow:hidden}
.glow-card:hover{border-color:rgba(0,212,170,.4);box-shadow:0 0 25px rgba(0,212,170,.08);transform:translateY(-1px)}
.btn-primary{background:linear-gradient(135deg,#00d4aa,#00a888);color:#0b0f19;font-weight:600;padding:10px 22px;border-radius:10px;border:none;cursor:pointer;transition:all .2s;font-family:inherit;font-size:14px}
.btn-primary:hover{box-shadow:0 4px 20px rgba(0,212,170,.3);transform:translateY(-1px)}
.btn-secondary{background:#1a2235;color:#e2e8f0;font-weight:500;padding:10px 22px;border-radius:10px;border:1px solid #243049;cursor:pointer;transition:all .2s;font-family:inherit;font-size:14px}
.btn-secondary:hover{border-color:#00d4aa;color:#00d4aa}
.btn-sm{padding:6px 14px;font-size:12px;border-radius:8px}
.badge{display:inline-flex;align-items:center;gap:4px;padding:3px 10px;border-radius:20px;font-size:11px;font-weight:500}
.progress-bar{height:7px;background:#1a2235;border-radius:4px;overflow:hidden}
.progress-fill{height:100%;border-radius:4px;transition:width .8s ease}
.toast{position:fixed;top:20px;right:20px;z-index:9999;padding:12px 22px;border-radius:10px;color:#fff;font-weight:500;animation:slideIn .4s ease,fadeOut .4s ease 2.6s;pointer-events:none;font-size:13px}
@keyframes slideIn{from{transform:translateX(100px);opacity:0}to{transform:translateX(0);opacity:1}}
@keyframes fadeOut{to{opacity:0;transform:translateY(-10px)}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.5}}
@keyframes xpPop{0%{opacity:0;transform:translate(-50%,-50%) scale(.5)}20%{opacity:1;transform:translate(-50%,-50%) scale(1.2)}40%{transform:translate(-50%,-50%) scale(1)}100%{opacity:0;transform:translate(-50%,-80%) scale(1)}}
.streak-fire{animation:pulse 1s ease-in-out infinite}
.xp-popup{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);z-index:9999;font-size:28px;font-weight:700;color:#fbbf24;animation:xpPop 1.5s ease forwards;pointer-events:none}
.ace_editor{font-family:'JetBrains Mono',monospace!important;font-size:13px!important;border-radius:0 0 12px 12px}
.editor-toolbar{background:#0b0f19;border-bottom:1px solid #1e293b;padding:8px 14px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.lang-tab{padding:5px 12px;border-radius:6px;cursor:pointer;font-size:12px;font-weight:500;transition:all .2s;color:#94a3b8}
.lang-tab.active{background:#00d4aa;color:#0b0f19}
.lang-tab:hover:not(.active){color:#e2e8f0}
.output-panel{background:#0b0f19;border:1px solid #1e293b;border-radius:12px;overflow:hidden}
.output-header{padding:9px 14px;border-bottom:1px solid #1e293b;display:flex;align-items:center;gap:8px;font-size:12px;font-weight:600}
.output-body{padding:14px;max-height:200px;overflow-y:auto;font-family:'JetBrains Mono',monospace;font-size:12px;white-space:pre-wrap}
.quiz-option{padding:12px 18px;border:1px solid #243049;border-radius:10px;cursor:pointer;transition:all .2s;font-size:14px;display:flex;align-items:center;gap:10px}
.quiz-option:hover{border-color:#00d4aa;background:rgba(0,212,170,.04)}
.quiz-option.correct{border-color:#00d4aa;background:rgba(0,212,170,.12);color:#00d4aa}
.quiz-option.wrong{border-color:#f43f5e;background:rgba(244,63,94,.08);color:#f43f5e}
.quiz-option.selected{border-color:#fbbf24;background:rgba(251,191,36,.08)}
.test-case{padding:10px 14px;border-radius:8px;font-size:12px;display:flex;align-items:center;gap:8px}
.test-case.pass{background:rgba(0,212,170,.08);color:#00d4aa}
.test-case.fail{background:rgba(244,63,94,.08);color:#f43f5e}
.search-input{background:#1a2235;border:1px solid #243049;border-radius:10px;padding:9px 14px;color:#e2e8f0;font-family:inherit;font-size:14px;width:100%;outline:none;transition:border .2s}
.search-input:focus{border-color:#00d4aa}
.tab-btn{padding:7px 14px;border-radius:8px;font-size:12px;font-weight:500;cursor:pointer;transition:all .2s;color:#94a3b8;background:transparent;border:none;font-family:inherit}
.tab-btn.active{background:rgba(0,212,170,.12);color:#00d4aa}
.tab-btn:hover:not(.active){color:#e2e8f0}
.achievement-card{background:#111827;border:1px solid #1e293b;border-radius:12px;padding:18px;text-align:center;transition:all .3s}
.achievement-card.unlocked{border-color:#fbbf24;box-shadow:0 0 15px rgba(251,191,36,.08)}
.achievement-card.locked{opacity:.4;filter:grayscale(.8)}
.mobile-topbar{display:none;position:fixed;top:0;left:0;right:0;height:56px;background:#111827;border-bottom:1px solid #1e293b;z-index:35;padding:0 14px;align-items:center;justify-content:space-between}
.overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:35}
@media(max-width:768px){.sidebar{transform:translateX(-100%)}.sidebar.open{transform:translateX(0)}.main-content{margin-left:0!important}.mobile-topbar{display:flex!important}}
.hero-canvas{position:absolute;inset:0;pointer-events:none;opacity:.35}
</style>
</head>
<body>

<div class="mobile-topbar" id="mobileTopbar">
  <button onclick="toggleSidebar()" class="text-lg text-gray-400 bg-transparent border-none cursor-pointer"><i class="fas fa-bars"></i></button>

    <div class="nav-item" data-page="dashboard"><i class="fas fa-th-large"></i>Dashboard</div>
    <div class="nav-item" data-page="learn"><i class="fas fa-book-open"></i>Learn</div>
    <div class="text-[10px] uppercase tracking-wider text-gray-600 font-semibold px-4 py-1.5 mt-1">Practice</div>
    <div class="nav-item" data-page="editor"><i class="fas fa-code"></i>Code Editor</div>
    <div class="nav-item" data-page="problems"><i class="fas fa-list-check"></i>Problems</div>
    <div class="nav-item" data-page="daily"><i class="fas fa-fire"></i>Daily Challenge</div>
    <div class="text-[10px] uppercase tracking-wider text-gray-600 font-semibold px-4 py-1.5 mt-1">Learn More</div>
    <div class="nav-item" data-page="videos"><i class="fas fa-play-circle"></i>Video Lessons</div>
    <div class="nav-item" data-page="quiz"><i class="fas fa-brain"></i>Quizzes</div>
    <div class="nav-item" data-page="interview"><i class="fas fa-briefcase"></i>Interview Prep</div>
    <div class="text-[10px] uppercase tracking-wider text-gray-600 font-semibold px-4 py-1.5 mt-1">Community</div>
    <div class="nav-item" data-page="progress"><i class="fas fa-chart-line"></i>Progress</div>
    <div class="nav-item" data-page="achievements"><i class="fas fa-trophy"></i>Achievements</div>
    <div class="nav-item" data-page="leaderboard"><i class="fas fa-ranking-star"></i>Leaderboard</div>
    <div class="text-[10px] uppercase tracking-wider text-gray-600 font-semibold px-4 py-1.5 mt-1">Account</div>
    <div class="nav-item" data-page="profile"><i class="fas fa-user"></i>Profile</div>
    <div class="nav-item" data-page="settings"><i class="fas fa-gear"></i>Settings</div>
  </div>
  <div class="p-3 border-t border-surface-600 mt-1" id="sidebarUser"></div>
</aside>

<main class="main-content" id="mainContent">
  <div class="p-5 md:p-8 max-w-7xl mx-auto" id="pageContainer"></div>
</main>
<div id="toastContainer"></div>

<script>

// ===== UTILS =====
function toast(m,t='success'){
  const c={success:'background:linear-gradient(135deg,#00d4aa,#00a888)',error:'background:linear-gradient(135deg,#f43f5e,#e11d48)',info:'background:linear-gradient(135deg,#3b82f6,#2563eb)',warning:'background:linear-gradient(135deg,#f59e0b,#d97706)'};
  const el=document.createElement('div');el.className='toast';el.style.cssText=c[t]||c.success;el.textContent=m;
  document.getElementById('toastContainer').appendChild(el);setTimeout(()=>el.remove(),3000);
}
function xpPop(a){const el=document.createElement('div');el.className='xp-popup code-font';el.textContent=`+${a} XP`;document.body.appendChild(el);setTimeout(()=>el.remove(),1500);}
function addXP(a){S.xp+=a;save();xpPop(a);updateSidebarUser();checkAch();}
function getLvl(){const x=S.xp;if(x>=5000)return 7;if(x>=3000)return 6;if(x>=2000)return 5;if(x>=1000)return 4;if(x>=500)return 3;if(x>=100)return 2;return 1;}
function getLvlName(l){return['','Absolute Beginner','Beginner','Basic Programmer','Intermediate','Advanced','Problem Solver','Interview Ready'][l]||'';}
function diffColor(d){return{Easy:'#00d4aa',Medium:'#fbbf24',Hard:'#f43f5e',Expert:'#a855f7'}[d]||'#94a3b8';}
function diffIcon(d){return{Easy:'🟢',Medium:'🟡',Hard:'🔴',Expert:'🟣'}[d]||'⚪';}
function allLessons(k){return(LANGS[k]||{levels:[]}).levels.flatMap(l=>l.lessons);}
function langProg(k){const t=allLessons(k).length;return t?Math.round(allLessons(k).filter(l=>S.done.includes(l.id)).length/t*100):0;}
function nextLesson(k){return allLessons(k).find(l=>!S.done.includes(l.id));}
function findLesson(id){for(const[k,lang]of Object.entries(LANGS))for(const lv of lang.levels)for(const l of lv.lessons)if(l.id===id)return{...l,lang:k,level:lv.name};return null;}
function findProblem(id){for(const[k,ps]of Object.entries(PROBLEMS))for(const p of ps)if(p.id===id)return{...p,lang:k};return null;}
function updateStreak(){const td=new Date().toDateString();if(S.lastLogin!==td){const yd=new Date(Date.now()-864e5).toDateString();S.streak=S.lastLogin===yd?S.streak+1:1;S.lastLogin=td;save();}}

  const na=[];
  function unlock(id,xp){if(!S.achs.includes(id)){S.achs.push(id);na.push({id,xp});}}
  if(S.user)unlock('first-login',10);
  if(S.xp>=500)unlock('xp500',0);if(S.xp>=2000)unlock('xp2000',0);
  if(S.solved.length>=10)unlock('prob10',50);
  const begCheck={c:'c-beg',python:'py-beg',java:'java-beg',sql:'sql-beg'};
  for(const[k,aid]of Object.entries(begCheck)){const beg=(LANGS[k]?.levels.find(l=>l.name==='Beginner')?.lessons||[]);if(beg.length&&beg.every(l=>S.done.includes(l.id)))unlock(aid,100);}
  save();
  na.forEach(a=>{const ach=ACHS.find(x=>x.id===a.id);if(ach){toast('Achievement: '+ach.t+'!','warning');if(a.xp)addXP(a.xp);}});
}

// ===== ROUTER =====
function nav(page,params=[]){
  S.page=page;setActiveNav(page);
  const c=document.getElementById('pageContainer');
  // Destroy old editors
  if(window._le){window._le.destroy();window._le=null;}
  if(window._me){window._me.destroy();window._me=null;}
  if(window._pe){window._pe.destroy();window._pe=null;}
  if(window._de){window._de.destroy();window._de=null;}
  window._charts=[];

  switch(page){
    case 'home':c.innerHTML=pageHome();initHero();break;
    case 'login':c.innerHTML=pageLogin();break;
    case 'signup':c.innerHTML=pageSignup();break;
    case 'dashboard':if(!S.user){nav('login');return;}c.innerHTML=pageDash();setTimeout(initDashCharts,50);break;
    case 'learn':c.innerHTML=params[0]?pageLesson(params[0]):pageLearn();if(params[0])setTimeout(()=>initLessonEd(params[0]),50);break;
    case 'editor':c.innerHTML=pageEditor();setTimeout(()=>initMainEd(),50);break;
    case 'problems':c.innerHTML=params[0]?pageProblem(params[0]):pageProblems();if(params[0])setTimeout(()=>initProbEd(params[0]),50);break;
    case 'daily':c.innerHTML=pageDaily();setTimeout(()=>initDailyEd(),50);break;
    case 'videos':c.innerHTML=pageVideos(params[0]);break;
    case 'quiz':c.innerHTML=params[0]?pageQuiz(params[0]):pageQuizList();break;
    case 'progress':c.innerHTML=pageProgress();setTimeout(initProgCharts,50);break;
    case 'achievements':c.innerHTML=pageAchievements();break;
    case 'leaderboard':c.innerHTML=pageLeaderboard();break;
    case 'profile':if(!S.user){nav('login');return;}c.innerHTML=pageProfile();break;
    case 'settings':c.innerHTML=pageSettings();break;
    case 'interview':c.innerHTML=pageInterview();break;
    case 'search':c.innerHTML=pageSearch(params[0]||'');break;
    default:c.innerHTML=pageHome();initHero();
  }
  document.getElementById('sidebar').classList.remove('open');document.getElementById('overlay').style.display='none';window.scrollTo(0,0);
}

function selAns(qi,oi){if(!_quiz)return;if(document.getElementById('qq'+qi).classList.contains('done'))return;_qAns[qi]=oi;for(let j=0;j<_quiz.qs[qi].o.length;j++){const el=document.getElementById('qo'+qi+'_'+j),ci=document.getElementById('qc'+qi+'_'+j);if(j===oi){el.classList.add('selected');ci.style.borderColor='#fbbf24';ci.style.color='#fbbf24';}else{el.classList.remove('selected');ci.style.borderColor='';ci.style.color='';}}}
function submitQuiz(id){
  if(!_quiz)return;let corr=0;
  _quiz.qs.forEach((q,i)=>{
    const qEl=document.getElementById('qq'+i);qEl.classList.add('done');
    document.getElementById('qe'+i)?.classList.remove('hidden');
    q.o.forEach((_,j)=>{const el=document.getElementById('qo'+i+'_'+j),ci=document.getElementById('qc'+i+'_'+j);el.style.cursor='default';if(j===q.a){el.classList.add('correct');ci.style.borderColor='#00d4aa';ci.style.color='#00d4aa';ci.innerHTML='<i class="fas fa-check text-[10px]"></i>';}else if(j===_qAns[i]&&j!==q.a){el.classList.add('wrong');ci.style.borderColor='#f43f5e';ci.style.color='#f43f5e';ci.innerHTML='<i class="fas fa-xmark text-[10px]"></i>';}});
    if(_qAns[i]===q.a)corr++;
  });
  const pct=Math.round(corr/_quiz.qs.length*100);S.quizScores[id]=pct;addXP(corr*5);
  if(!S.achs.includes('first-quiz')){S.achs.push('first-quiz');addXP(25);}checkAch();save();
  document.getElementById('quizSub').style.display='none';
  document.getElementById('quizRes').innerHTML=`<div class="glow-card p-5 text-center"><div class="text-3xl font-bold mb-1 font-display" style="color:${pct>=70?'#00d4aa':'#f43f5e'}">${pct}%</div><p class="text-gray-400 text-sm">${corr}/${_quiz.qs.length} correct</p><p class="text-accent code-font text-sm mt-1">+${corr*5} XP</p></div>`;
  toast(pct>=70?'Quiz passed!':'Review the explanations.',pct>=70?'success':'warning');
}

function pageSearch(q){
  q=(q||'').toLowerCase();
  if(!q)return `<h1 class="text-2xl font-bold text-white font-display mb-5">Search</h1><div class="glow-card p-10 text-center"><i class="fas fa-search text-3xl text-gray-700 mb-3"></i><p class="text-gray-500 text-sm">Search for lessons, problems, or topics</p></div>`;
  let res=[];
  for(const[k,lang]of Object.entries(LANGS))for(const lv of lang.levels)for(const l of lv.lessons)if(l.title.toLowerCase().includes(q)||l.desc.toLowerCase().includes(q))res.push({type:'Lesson',title:l.title,sub:LM[k].name+' — '+l.desc,action:`nav('learn','${l.id}')`});
  for(const[k,ps]of Object.entries(PROBLEMS))for(const p of ps)if(p.t.toLowerCase().includes(q)||p.d.toLowerCase().includes(q)||p.cat.toLowerCase().includes(q))res.push({type:'Problem',title:p.t,sub:LM[k].name+' — '+p.diff,action:`nav('problems','${p.id}')`});
  for(const[k,qs2]of Object.entries(QUIZZES))for(const qz of qs2)if(qz.topic.toLowerCase().includes(q))res.push({type:'Quiz',title:LM[k].name+': '+qz.topic,sub:qz.qs.length+' Questions',action:`nav('quiz','${qz.id}')`});
  return `<h1 class="text-2xl font-bold text-white font-display mb-1">Search</h1><p class="text-gray-500 text-sm mb-5">${res.length} results for "${q}"</p>
  ${res.length?`<div class="space-y-2">${res.map(r=>`<div class="glow-card p-3 cursor-pointer flex items-center gap-3" onclick="${r.action}"><div class="w-7 h-7 rounded-lg bg-surface-600 flex items-center justify-center text-[10px] text-gray-400 shrink-0">${r.type[0]}</div><div class="flex-1 min-w-0"><div class="text-white text-sm font-medium">${r.title}</div><div class="text-gray-600 text-[10px] truncate">${r.sub}</div></div></div>`).join('')}</div>`:'<div class="glow-card p-10 text-center"><p class="text-gray-500 text-sm">No results found.</p></div>'}`;
}

// ===== CODE EXECUTION =====
let _pyodide=null,_pyLoading=false,_sqljs=null;
async function getPy(){
  if(_pyodide)return _pyodide;if(_pyLoading){while(_pyLoading)await new Promise(r=>setTimeout(r,100));return _pyodide;}
  _pyLoading=true;
  try{if(!window.loadPyodide)await new Promise((r,j)=>{const s=document.createElement('script');s.src='https://cdn.jsdelivr.net/pyodide/v0.24.1/full/pyodide.js';s.onload=r;s.onerror=j;document.head.appendChild(s);});_pyodide=await window.loadPyodide();_pyLoading=false;return _pyodide;}catch(e){_pyLoading=false;throw e;}
}
async function getSQL(){
  if(_sqljs)return _sqljs;
  if(!window.initSqlJs)await new Promise((r,j)=>{const s=document.createElement('script');s.src='https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.10.3/sql-wasm.js';s.onload=r;s.onerror=j;document.head.appendChild(s);});
  _sqljs=await window.initSqlJs({locateFile:f=>`https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.10.3/${f}`});return _sqljs;
}
async function runCode(code,lang,input=''){
  if(lang==='python'){try{const py=await getPy();let out='',err='';py.runPython('import sys,io\nsys.stdout=io.StringIO()\nsys.stderr=io.StringIO()\nsys.stdin=io.StringIO('+JSON.stringify(input)+')\n');try{await py.runPythonAsync(code);out=py.runPython('sys.stdout.getvalue()');err=py.runPython('sys.stderr.getvalue()');}catch(e){err=e.message||String(e);}py.runPython('sys.stdout=sys.__stdout__\nsys.stderr=sys.__stderr__\nsys.stdin=sys.__stdin__\n');return {out:out.trim(),err:err.trim()};}catch(e){return {out:'',err:'Python load error: '+e.message};}}
  if(lang==='sql'){try{const SQL=await getSQL();const db=new SQL.Database();let out='';try{const stmts=code.split(';').filter(s=>s.trim());for(const st of stmts){if(!st.trim())continue;try{const r=db.exec(st.trim());if(r.length){out+=r[0].columns.join('\t')+'\n';r[0].values.forEach(row=>{out+=row.join('\t')+'\n';});}}catch(e){return {out:'',err:e.message};}}}finally{db.close();}return {out:out.trim(),err:''};}catch(e){return {out:'',err:'SQL error: '+e.message};}}
  return {out:'(C/Java execution requires a backend server. Python and SQL run natively in your browser via WebAssembly!)',err:''};
}
function fmtErr(e){const lm=e.match(/line (\d+)/i);let f='';if(lm)f+='Error on Line '+lm[1]+'\n\n';let m=e.replace(/.*File "<string>", line \d+/,'').trim();if(m.startsWith(':'))m=m.substring(1).trim();if(!f)f='Error:\n';f+=m;if(m.toLowerCase().includes('syntaxerror'))f+='\n\nTip: Check for missing colons, parentheses, or quotes.';else if(m.toLowerCase().includes('nameerror'))f+='\n\nTip: Variable or function not defined.';else if(m.toLowerCase().includes('typeerror'))f+='\n\nTip: Check your data types.';else if(m.toLowerCase().includes('indentationerror'))f+='\n\nTip: Fix your indentation.';return f;}

// ===== RUN HANDLERS =====
async function runLesson(id){const ls=findLesson(id);if(!ls||!window._le)return;const o=document.getElementById('lOut'),ep=document.getElementById('lErrP'),er=document.getElementById('lErr');o.textContent='Running...';ep.style.display='none';const r=await runCode(window._le.getValue(),ls.lang);o.textContent=r.out||'(no output)';o.style.color=r.err?'#f43f5e':'#4ade80';if(r.err){ep.style.display='';er.textContent=fmtErr(r.err);}if(!S.achs.includes('first-code')){S.achs.push('first-code');addXP(20);checkAch();save();}}
async function runEditor(){if(!window._me)return;const op=document.getElementById('edOutP'),o=document.getElementById('edOut'),ep=document.getElementById('edErrP'),e=document.getElementById('edErr');op.style.display='';ep.style.display='none';o.textContent='Running...';o.style.color='#4ade80';const r=await runCode(window._me.getValue(),S.editorLang);o.textContent=r.out||'(no output)';if(r.err){ep.style.display='';e.textContent=fmtErr(r.err);}}
async function runProb(id){if(!window._pe)return;const el=document.getElementById('probRes');el.innerHTML='<div class="output-panel"><div class="output-header text-primary"><i class="fas fa-spinner fa-spin"></i> Running...</div></div>';const p=findProblem(id),tc=p.tc[0],r=await runCode(window._pe.getValue(),p.lang,tc.i);el.innerHTML=`<div class="output-panel"><div class="output-header text-primary"><i class="fas fa-terminal"></i> Output</div><div class="output-body" style="color:${r.err?'#f43f5e':'#4ade80'}">${r.err?fmtErr(r.err):(r.out||'(no output)')}</div></div>`;}
async function submitProb(id){if(!window._pe)return;const p=findProblem(id);if(!p)return;const el=document.getElementById('probRes');el.innerHTML='<div class="text-center py-6 text-gray-500"><i class="fas fa-spinner fa-spin text-xl mb-1"></i><p class="text-sm">Running tests...</p></div>';let pass=0;const res=[];for(const tc of p.tc){const r=await runCode(window._pe.getValue(),p.lang,tc.i);const ok=!r.err&&r.out.trim()===tc.o.trim();if(ok)pass++;res.push({tc,ok});}const allOk=pass===p.tc.length;if(allOk&&!S.solved.includes(id)){S.solved.push(id);addXP(p.xp);if(!S.achs.includes('first-prob')){S.achs.push('first-prob');addXP(30);}checkAch();save();}
el.innerHTML=`<div class="glow-card p-4 mb-3"><h4 class="text-white font-semibold text-sm mb-2">Test Cases: ${pass}/${p.tc.length} Passed</h4><div class="space-y-1">${res.map((r,i)=>`<div class="test-case ${r.ok?'pass':'fail'}"><i class="fas ${r.ok?'fa-check-circle':'fa-times-circle'}"></i><span class="flex-1 text-xs">Case ${i+1}: ${r.tc.i||'(none)'}</span></div>`).join('')}</div></div>${allOk?`<div class="text-center"><div class="text-xl mb-1">🎉</div><div class="text-primary font-bold">All Passed!</div><div class="text-accent code-font text-sm">+${p.xp} XP</div></div>`:'<div class="text-center text-rose-400 text-sm">Some cases failed. Try again!</div>'}`;}
async function runDaily(){if(!window._de)return;const el=document.getElementById('dailyRes');const ch=DAILY[new Date().getDate()%DAILY.length],tc=ch.tc[0];el.innerHTML='<div class="output-panel"><div class="output-header text-primary"><i class="fas fa-spinner fa-spin"></i> Running...</div></div>';const r=await runCode(window._de.getValue(),ch.lang,tc.i);el.innerHTML=`<div class="output-panel"><div class="output-header text-primary"><i class="fas fa-terminal"></i> Output</div><div class="output-body" style="color:${r.err?'#f43f5e':'#4ade80'}">${r.err?fmtErr(r.err):(r.out||'(no output)')}</div></div>`;}
async function submitDaily(){if(!window._de)return;const el=document.getElementById('dailyRes');const ch=DAILY[new Date().getDate()%DAILY.length];el.innerHTML='<div class="text-center py-6 text-gray-500"><i class="fas fa-spinner fa-spin text-xl mb-1"></i></div>';let pass=0;for(const tc of ch.tc){const r=await runCode(window._de.getValue(),ch.lang,tc.i);if(!r.err&&r.out.trim()===tc.o.trim())pass++;}const allOk=pass===ch.tc.length;if(allOk){addXP(ch.xp);save();}
el.innerHTML=`<div class="glow-card p-4 mb-3"><h4 class="text-white font-semibold text-sm mb-2">Results: ${pass}/${ch.tc.length}</h4><div class="progress-bar"><div class="progress-fill" style="width:${pass/ch.tc.length*100}%;background:${allOk?'#00d4aa':'#f43f5e'}"></div></div></div>${allOk?'<div class="text-center text-primary font-bold">Challenge Complete! +'+ch.xp+' XP</div>':'<div class="text-center text-rose-400 text-sm">Not all passed. Keep trying!</div>'}`;}

// ===== CHARTS =====
function destroyCharts(){(window._charts||[]).forEach(c=>{try{c.destroy();}catch(e){}});window._charts=[];}
function initDashCharts(){destroyCharts();const el=document.getElementById('dashChart');if(!el)return;const c=new Chart(el,{type:'doughnut',data:{labels:Object.keys(LM).map(k=>LM[k].name),datasets:[{data:Object.keys(LM).map(k=>langProg(k)),backgroundColor:Object.values(LM).map(m=>m.color),borderWidth:0,hoverOffset:6}]},options:{responsive:true,plugins:{legend:{position:'bottom',labels:{color:'#94a3b8',font:{family:'Space Grotesk',size:11},padding:10}}},cutout:'65%'}});window._charts.push(c);}
function initProgCharts(){destroyCharts();const b=document.getElementById('progBar');if(b){const c=new Chart(b,{type:'bar',data:{labels:Object.keys(LM).map(k=>LM[k].name),datasets:[{data:Object.keys(LM).map(k=>langProg(k)),backgroundColor:Object.values(LM).map(m=>m.color),borderRadius:6,barThickness:35}]},options:{responsive:true,scales:{y:{beginAtZero:true,max:100,ticks:{color:'#64748b'},grid:{color:'#1e293b'}},x:{ticks:{color:'#94a3b8',font:{family:'Space Grotesk',size:11}},grid:{display:false}}},plugins:{legend:{display:false}}}});window._charts.push(c);}
const d=document.getElementById('progDonut');if(d){const tl=Object.values(LANGS).reduce((a,l)=>a+l.levels.reduce((b,v)=>b+v.lessons.length,0),0),tp=Object.values(PROBLEMS).reduce((a,p)=>a+p.length,0),tq=Object.values(QUIZZES).reduce((a,q)=>a+q.length,0);const c=new Chart(d,{type:'doughnut',data:{labels:['Lessons','Problems','Quizzes'],datasets:[{data:[Math.round(S.done.length/Math.max(tl,1)*100),Math.round(S.solved.length/Math.max(tp,1)*100),Math.round(Object.keys(S.quizScores).length/Math.max(tq,1)*100)],backgroundColor:['#00d4aa','#fbbf24','#a855f7'],borderWidth:0}]},options:{responsive:true,plugins:{legend:{position:'bottom',labels:{color:'#94a3b8',font:{family:'Space Grotesk',size:11},padding:10}}},cutout:'60%'}});window._charts.push(c);}}

// ===== HERO CANVAS =====
function initHero(){const cv=document.getElementById('heroCanvas');if(!cv)return;const ctx=cv.getContext('2d');const p=cv.parentElement;function resize(){cv.width=p.offsetWidth;cv.height=p.offsetHeight;}resize();window.addEventListener('resize',resize);
const chars='{}[]();=>+-*/%'.split('');const drops=Array.from({length:30},()=>({x:Math.random()*cv.width,y:Math.random()*cv.height,s:Math.random()*0.5+0.2,c:chars[Math.floor(Math.random()*chars.length)],o:Math.random()*0.3+0.1}));
function draw(){ctx.clearRect(0,0,cv.width,cv.height);drops.forEach(d=>{ctx.fillStyle=`rgba(0,212,170,${d.o})`;ctx.font=`${12+d.s*4}px JetBrains Mono`;ctx.fillText(d.c,d.x,d.y);d.y+=d.s*0.8;if(d.y>cv.height){d.y=-20;d.x=Math.random()*cv.width;d.c=chars[Math.floor(Math.random()*chars.length)];}});requestAnimationFrame(draw);}draw();}

load();updateSidebarUser();updateStreak();checkAch();nav('home');
